- title: The RAISE Project
  id: the-raise-project
  body: "The RAISE Esprit project (1984-1991), of which I was part, developed the specification language\
    \ RSL\n(RAISE Specification Language), as well as a refinement-based method and tools,\nsuch as editors,\
    \ type checkers, and proof tools. I was part of the 5 year language design\neffort, including writing\
    \ dynamic semantics.\nThe language was supposed to be a derivative of VDM, but took a completely\n\
    different turn, combining algebraic specification with model-based specification,\nand a process specification\
    \ language inspired by CCS and CSP.\nThe contributors to the language were many over a more than 5\
    \ year period.\nThose that lastet to the end were Dines Bjoerner, Chris George, Peter Haff, Klaus\
    \ Havelund,\nAnne Haxthausen, Robert Milne, Claus Bendix Nielsen, Soeren\nPrehn and Kim Ritter Wagner.\
    \ The RAISE project was started by Dines Bjoerner.\n  \n  \nThis project was a lot of fun and we studied\
    \ a lot of specification languages and semantics\npapers. Doing specification language design for\
    \ 5 years does create a desire for\nexperiencing/designing? the perfect programming language, a thought\
    \ I have not yet given up.\nI claim that such a language does exist, and it is not far removed from\
    \ those\nold specification languages. Scala is an excellent example.\n  \n  \nThe following reports\
    \ are early and not quite complete versions of an RSL tutorial (which I wrote)\nand an RSL reference\
    \ manual (which I wrote the dynamic semantics part of, while Anne Haxthausen\nwrote the static semantics/wellformedness\
    \ part).\n\n---\n\n***An RSL Tutorial**  \nK. Havelund*\n**Technical Report, Version 1, April 6, 1990**\n\
    \  \nComputer Resources International A/S.\n  \n[pdf](/Publications/RSL_Tutorial_V1.pdf)\n\n---\n\n\
    ***An RSL Reference Manual**  \nK. Havelund and A. Haxthausen*\n**Technical Report, Version 1, April\
    \ 6, 1990**\n  \nComputer Resources International A/S.\n  \n[pdf](/Publications/RSL_Manual_V1.pdf)\n\
    \n  \n  \nIn addition I co-authored numerous\n[Raise reports](/Publications/raise.pdf), which unfortunately\
    \ seem\nto have gone lost.\n  \n  \n[RAISE website](http://oersted.terma.com/Projects/RAISE)\n\n---"
- title: Theses
  id: theses
  body: "---\n\n***The Fork Calculus - Towards a Logic for Concurrent ML**  \nK. Havelund*\n**Ph.D. thesis**\n\
    \  \nDIKU, Department of Computer Science, University\nof Copenhagen, Denmark, 1994.\n  \nSupervisors:\
    \ Klaus Grue and Kim Guldstrand Larsen.\n  \nPerformed at Ecole Normale Superieure, Paris, France,\n\
    while attending the groups of Michel Bidoit and Patrick\nCousot.\n  \n[pdf](/Publications/thesis.pdf)\n\
    \n---\n\n***Stepwise Development of a Denotational Stack Semantics**  \nK. Havelund*\n  \n**Master\
    \ thesis**\n  \nDIKU, Department of Computer Science, University\nof Copenhagen, Denmark, 1984.\n\
    \  \nSupervisor: Neil Jones.\n  \nElectronic copy is not available (lost in one of many computer-to-computer\
    \ moves).  \nIf you have a copy, let me know.\n\n---"
