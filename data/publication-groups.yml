    \  \n[pdf](/Publications/jpl-java-standard.pdf)\n\n---"
- title: Books and Book Chapters
  id: books-and-book-chapters
  body: "---\n\n***RAISE in Perspective**  \nKlaus Havelund*\nChapter in [Logics of Specification Languages](http://www.springer.com/978-3-540-74106-0)\n\
    \  \nMonographs in Theoretical Computer Science. An EATCS Series, 2007\n  \nBjorner, Dines; Henson,\
    \ Martin C. (Eds.)\n  \n624 p., Hardcover\n  \nThe brief chapter (4 pages) comments on RSL, the RAISE\
    \ Specification Language.  \n[pdf](/Publications/havelund-losl.pdf)\n\n---\n\n***The RAISE Specification\
    \ Language**  \nThe RAISE Language Group*\nPrentice Hall. The BCS Practitioner Series, 1992.\n  \n\
    For sale at [amazon.com](http://www.amazon.com/gp/product/0137528337/sr=8-1/qid=1142196477/ref=sr_1_1/002-7669108-1244013?%5Fencoding=UTF8)\n\
    \  \n  \nThe book consists of two parts I: RSL Tutorial (pages 9-250),\nand II: RSL Reference Description\
    \ (pages 251-369).\n  \nHavelund wrote part I, while\nHavelund together with Anne Haxthausen wrote\
    \ part II.\nThe language presented in the book was designed during the period 1985-1991 by many people.\n\
    Those that lastet to the end were the *RAISE\nLanguage Group*: Chris George, Peter Haff, Klaus Havelund,\n\
    Anne Haxthausen, Robert Milne, Claus Bendix Nielsen, Soeren\nPrehn and Kim Ritter Wagner.\nThe RAISE\
    \ project was started by Dines Bjoerner.\n  \n  \nAn early version of the book is the RSL tutorial\
    \ (draft) below (April 6, 1990).\n\n---"
